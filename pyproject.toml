[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "nightwatch-evolution"
version = "0.1.0"
description = "A deterministic promotion gate for autonomous small-model improvement."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
train = [
  "accelerate>=1.12,<2",
  "datasets>=5.0.1,<6",
  "peft>=0.18,<1",
  "torch>=2.9,<3",
  "transformers>=5.5,<6",
  "trl>=0.29,<0.30",
]
agent = [
  "google-adk[a2a]>=2.8,<3",
  "google-genai>=2.9,<3",
  "sqlparse>=0.6,<1",
  "starlette>=1.3.1,<2",
  "uvicorn>=0.38,<1",
]
cloud = [
  "google-cloud-firestore>=2.21,<3",
  "google-cloud-storage>=3.3,<4",
  "google-cloud-tasks>=2.20,<3",
]
experiment = ["modal>=1.5,<2"]
service = [
  "flask>=3.1,<4",
  "google-cloud-firestore>=2.21,<3",
  "google-cloud-storage>=3.3,<4",
  "google-cloud-tasks>=2.20,<3",
  "gunicorn>=23,<24",
]
dev = ["pytest>=9,<10"]

[project.scripts]
nightwatch = "nightwatch.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/nightwatch"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
